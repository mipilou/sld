<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f3d3e">
  <meta name="description" content="Gestion locative intuitive pour propriétaires à Libreville">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GestiLoc">
  <link rel="stylesheet" href="/styles.css">
  <title>GestiLoc Libreville</title>
</head>
<body>
  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">GL</div>
        <div><strong>GestiLoc</strong><span>Libreville</span></div>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Fermer le menu">×</button>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Vue d'ensemble</button>
        <div class="nav-group open">
          <button class="nav-parent" aria-expanded="true"><span>▦</span> Patrimoine <b>⌄</b></button>
          <div class="nav-children">
            <button data-view="properties">Propriétés</button>
            <button data-view="units">Logements</button>
            <button data-view="tenants">Locataires</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-parent" aria-expanded="true"><span>₣</span> Finances <b>⌄</b></button>
          <div class="nav-children">
            <button data-view="payments">Paiements</button>
            <button data-view="invoices">Factures mensuelles</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-parent" aria-expanded="true"><span>✓</span> Suivi <b>⌄</b></button>
          <div class="nav-children">
            <button data-view="leases">Contrats de bail</button>
            <button data-view="inspections">États des lieux</button>
            <button data-view="maintenance">Travaux</button>
          </div>
        </div>
        <button class="nav-item" data-view="reports"><span>↗</span> Rapports</button>
        <button class="nav-item" data-view="settings"><span>⚙</span> Paramètres</button>
      </nav>
      <div class="sidebar-foot"><span class="sync-dot"></span><span id="syncLabel">Mode local</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">☰</button>
        <div><p class="eyebrow">Espace propriétaire</p><h1 id="pageTitle">Vue d'ensemble</h1></div>
        <div class="top-actions">
          <button class="icon-button" id="installBtn" title="Installer l'application" hidden>⤓</button>
          <button class="icon-button" id="syncBtn" title="Synchroniser" aria-label="Synchroniser">↻</button>
          <button class="owner-chip" id="ownerChip"></button>
        </div>
      </header>
      <section class="content" id="app"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose">×</button></div>
      <form id="modalForm"><div id="modalBody"></div><div class="modal-actions"><button type="button" class="btn secondary" id="modalCancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="login" id="login"><form id="loginForm"><div class="brand-mark">GL</div><h2>GestiLoc Libreville</h2><p id="loginIntro">Connectez-vous pour accéder à votre patrimoine.</p><div id="loginNameWrap" hidden><label for="loginName">Votre nom</label><input id="loginName" autocomplete="name" placeholder="Votre nom"></div><div id="loginEmailWrap"><label for="loginEmail">Adresse e-mail</label><input id="loginEmail" type="email" autocomplete="email" placeholder="vous@exemple.com" required></div><div id="loginPasswordWrap"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required></div><p class="err" id="loginErr" hidden></p><button class="btn primary" type="submit" id="loginSubmit">Se connecter</button><div class="auth-links"><button type="button" id="signupBtn">Créer un compte</button><button type="button" id="recoverBtn">Mot de passe oublié ?</button><button type="button" id="backLoginBtn" hidden>Retour à la connexion</button></div></form></div>
  <noscript>GestiLoc nécessite JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
